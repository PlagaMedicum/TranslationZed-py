[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "translationzed_py"
version         = "0.9.0"
description     = "Python + Qt CAT tool for Project Zomboid localisation files."
requires-python = ">=3.10"
authors         = [ { name = "TranslationZed‑Py team" } ]
license         = "GPL-3.0-only"
license-files   = ["LICENSE"]
readme          = "README.md"

# Runtime deps — keep minimal
dependencies = [
    "PySide6>=6.6",          # Qt 6 bindings for Python
    "xxhash>=3.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.112.0",
    "coverage>=7.6.0",
    "bandit>=1.7.8",
    "pydocstyle>=6.3.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "zensical>=0.0.24",
    "mkdocstrings[python]>=0.26.1",
    "griffe>=1.6.0",
    "pymdown-extensions>=10.8",
    "mutmut>=2.4.4",
    "pre-commit>=3.6",
    "build>=1.2",
    "wheel>=0.46",
    "PySide6-stubs>=2.1",
]
packaging = [
    "pyinstaller>=6.3",
]

[project.scripts]
tz = "translationzed_py.__main__:main"

[tool.setuptools.packages.find]
include = ["translationzed_py*"]
exclude = ["config*", "docs*", "scripts*", "tests*", "build*", "dist*"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[[tool.mypy.overrides]]
module = "translationzed_py.gui.*"
ignore_errors = true       # GUI code uses Qt – relax the checker here

[tool.pytest.ini_options]
addopts = "-ra -q --benchmark-skip"
testpaths = ["tests"]
norecursedirs = [
    "mutants",
    ".external",
    "artifacts",
    "build",
    "dist",
    ".pytest_cache",
    ".hypothesis",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
]

[tool.mutmut]
also_copy = [
    "translationzed_py/core/__init__.py",
    "translationzed_py/core/app_config.py",
    "translationzed_py/core/architecture_guard.py",
    "translationzed_py/core/atomic_io.py",
    "translationzed_py/core/en_diff_service.py",
    "translationzed_py/core/en_diff_snapshot.py",
    "translationzed_py/core/en_hash_cache.py",
    "translationzed_py/core/en_insert_plan.py",
    "translationzed_py/core/encoding_diagnostics.py",
    "translationzed_py/core/file_workflow.py",
    "translationzed_py/core/git_sync.py",
    "translationzed_py/core/languagetool.py",
    "translationzed_py/core/lazy_entries.py",
    "translationzed_py/core/locale_creation.py",
    "translationzed_py/core/model.py",
    "translationzed_py/core/parse_utils.py",
    "translationzed_py/core/preferences.py",
    "translationzed_py/core/preferences_service.py",
    "translationzed_py/core/project_scanner.py",
    "translationzed_py/core/qa_rules.py",
    "translationzed_py/core/qa_service.py",
    "translationzed_py/core/render_workflow_service.py",
    "translationzed_py/core/runtime_diagnostics.py",
    "translationzed_py/core/search.py",
    "translationzed_py/core/session_resume.py",
    "translationzed_py/core/source_reference_service.py",
    "translationzed_py/core/tm_import_sync.py",
    "translationzed_py/core/tm_preferences.py",
    "translationzed_py/core/tm_query.py",
    "translationzed_py/core/tm_query_contracts.py",
    "translationzed_py/core/tm_query_engine.py",
    "translationzed_py/core/tm_query_policy.py",
    "translationzed_py/core/tm_query_scoring.py",
    "translationzed_py/core/tm_query_text.py",
    "translationzed_py/core/tm_rebuild.py",
    "translationzed_py/core/tm_store.py",
    "translationzed_py/core/tm_store_support.py",
    "translationzed_py/core/tm_workflow_service.py",
    "translationzed_py/core/tmx_io.py",
    "translationzed_py/core/tzp_comment_policy.py",
]
paths_to_mutate = [
    "translationzed_py/core/parser.py",
    "translationzed_py/core/saver.py",
    "translationzed_py/core/status_cache.py",
    "translationzed_py/core/project_session.py",
    "translationzed_py/core/save_exit_flow.py",
    "translationzed_py/core/conflict_service.py",
    "translationzed_py/core/search_replace_service.py",
]
tests_dir = [
    "tests/test_parser_features.py",
    "tests/test_parser_offset_map_invariants.py",
    "tests/test_parser_branch_coverage.py",
    "tests/test_parser_perf_contract.py",
    "tests/test_saver.py",
    "tests/test_roundtrip.py",
    "tests/test_regression_roundtrip.py",
    "tests/test_status_cache.py",
    "tests/test_status_cache_helpers.py",
    "tests/test_status_cache_edge_branches.py",
    "tests/test_project_session.py",
    "tests/test_save_exit_flow.py",
    "tests/test_conflict_service.py",
    "tests/test_search_replace_service.py",
    "tests/test_search_wave2_equivalence.py",
    "tests/test_search_perf_contract.py",
]
pytest_add_cli_args_test_selection = ["--ignore=tests/benchmarks"]
