name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        run: make ci-deps
      - name: Configure Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: L0 static gate
        run: make gate-dev

  tests-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        run: make ci-deps
      - name: Configure Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Fixed core baseline
        run: make test-core-fast
      - name: Coverage strict lane
        run: make test-cov
      - name: Read-only diagnostics guard
        run: make test-readonly-clean
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-coverage-artifacts
          path: artifacts

  docs-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        run: make ci-deps
      - name: Configure Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Docs/contracts strict lane
        run: make docs-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Security lane
        run: make security
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: artifacts/security

  perf-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        run: make ci-deps
      - name: Configure Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Performance contract lane
        run: make test-perf-scale

  manual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Manual scenario contract lane
        run: make test-ui-manual-contract

  ci-pr:
    name: CI Required Aggregate
    runs-on: ubuntu-latest
    needs:
      - static
      - tests-coverage
      - docs-contracts
      - security
      - perf-contract
      - manual-contract
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Aggregate status
        run: echo "CI required gate set passed."

  heavy-advisory:
    runs-on: ubuntu-latest
    needs:
      - static
      - tests-coverage
      - docs-contracts
      - security
      - perf-contract
      - manual-contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (Linux)
        run: make ci-deps
      - name: Configure Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Heavy advisory lane
        run: make gate-heavy-advisory
      - name: Upload heavy mutation summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-mutation-summary
          path: artifacts/mutation/summary.json
          if-no-files-found: ignore
      - name: Upload heavy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-advisory-artifacts
          path: artifacts
