site_name: TranslationZed-Py Documentation
docs_dir: docs
site_dir: artifacts/docs/site
use_directory_urls: false
strict: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_signature_annotations: true
            members_order: source

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/mermaid-init.js
  - assets/js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/docs.css

nav:
  - Home: index.md
  - Meta:
      - Documentation Structure: meta/docs_structure.md
      - Quick Context: reference/quick_context.md
      - Automation Surface: reference/automation_surface.md
      - Test Surface: reference/test_surface.md
      - Module Map: reference/module_map.md
      - On-demand Contract Context: reference/contract_index.md
      - Active Risk Register: reference/risk_register.md
  - Specifications:
      - Technical Specification: spec/technical.md
      - v0.9 Feature Contracts:
          - Overview: spec/v0_9/overview.md
          - QA Live Checklist: spec/v0_9/qa_live_checklist.md
          - TM Quality and Explainability: spec/v0_9/tm_quality_explainability.md
          - TM Workflow UX: spec/v0_9/tm_workflow_ux.md
          - Crash Recovery UC-12: spec/v0_9/crash_recovery_uc12.md
      - Use Cases and UX:
          - UX Overview: ux/use_cases.md
          - Project Lifecycle and Save: ux/use_cases_project_lifecycle.md
          - Editing and Status: ux/use_cases_editing_status.md
          - Search and QA: ux/use_cases_search_qa.md
          - TM Workflows: ux/use_cases_tm.md
  - Architecture:
      - Overview: architecture/overview.md
      - Code Architecture: architecture/code_architecture.md
      - Flows: architecture/flows.md
      - Diagrams: architecture/diagrams.md
  - Domain:
      - B42 Translation JSON: domain/b42_json_format.md
      - TM Ranking: domain/tm_ranking.md
  - Quality:
      - Testing Strategy: quality/testing_strategy.md
      - Assurance Standard: quality/assurance_standard.md
      - Checklists: operations/checklists.md
  - API:
      - API Overview: reference/api/index.md
      - Core Workflows: reference/api/core_workflows.md
      - Core Data/IO: reference/api/core_data_io.md
      - Core Preferences: reference/api/core_preferences.md
  - Performance:
      - Math Appendix: performance/math_appendix.md
  - Planning:
      - Active Plan: plan/implementation_active.md
      - Decisions and Lessons: plan/implementation_history.md
